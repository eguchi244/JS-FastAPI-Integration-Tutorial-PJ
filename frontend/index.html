<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>タスク管理アプリ（API連携版）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>タスク管理アプリ（API連携版）</h1>

    <!-- ローディング表示 -->
    <div id="loading" class="loading hidden">通信中...</div>

    <!-- エラー表示 -->
    <div id="error" class="error hidden"></div>

    <!-- タスク追加フォーム -->
    <form id="taskForm" class="task-form">
      <input type="text" id="taskInput" placeholder="タスクを入力..." autocomplete="off">
      <button type="submit" class="btn btn-add">追加</button>
    </form>

    <!-- タスク一覧（イベントデリゲーションの親要素） -->
    <ul id="taskList" class="task-list"></ul>

    <!-- フッター（件数表示） -->
    <footer id="taskCount" class="task-count"></footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
